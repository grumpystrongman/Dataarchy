name: Deploy Dataarchy to Databricks Apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to deploy
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_warehouse_id: ${{ vars.DATAARCHY_WAREHOUSE_ID }}
      BUNDLE_VAR_genie_space_id: ${{ vars.DATAARCHY_GENIE_SPACE_ID }}
      BUNDLE_VAR_model_endpoint_name: ${{ vars.DATAARCHY_MODEL_ENDPOINT_NAME }}
      BUNDLE_VAR_state_volume_full_name: ${{ vars.DATAARCHY_STATE_VOLUME_FULL_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DATABRICKS_HOST
            DATABRICKS_CLIENT_ID
            BUNDLE_VAR_warehouse_id
            BUNDLE_VAR_genie_space_id
            BUNDLE_VAR_model_endpoint_name
            BUNDLE_VAR_state_volume_full_name
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Validate bundle
        run: databricks bundle validate --target "${{ inputs.target }}"

      - name: Deploy bundle
        run: databricks bundle deploy --target "${{ inputs.target }}"

      - name: Start or restart Dataarchy
        run: databricks bundle run dataarchy --target "${{ inputs.target }}"

      - name: Wait for app to report RUNNING
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            state="$(databricks apps get dataarchy --output json | jq -r '.app_status.state // empty')"
            echo "App state attempt $attempt: ${state:-unknown}"
            if [ "$state" = "RUNNING" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Dataarchy did not reach RUNNING state." >&2
          exit 1

      - name: Smoke test deployed app
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="$(databricks apps get dataarchy --output json | jq -r '.url')"
          TOKEN="$(databricks auth token | jq -r '.access_token')"
          if [ -z "$APP_URL" ] || [ "$APP_URL" = "null" ]; then
            echo "Databricks did not return an app URL." >&2
            exit 1
          fi

          system_status="$(curl -sS -o /tmp/dataarchy-system.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "$APP_URL/api/system" || true)"
          if [ "$system_status" != "200" ]; then
            echo "Dataarchy /api/system returned HTTP $system_status" >&2
            cat /tmp/dataarchy-system.json 2>/dev/null || true
            exit 1
          fi

          install_status="$(curl -sS -o /tmp/dataarchy-install.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "$APP_URL/api/install" || true)"
          if [ "$install_status" != "200" ]; then
            echo "Dataarchy /api/install returned HTTP $install_status" >&2
            cat /tmp/dataarchy-install.json 2>/dev/null || true
            exit 1
          fi

          ready="$(jq -r '.ready' /tmp/dataarchy-install.json)"
          cat /tmp/dataarchy-install.json
          if [ "$ready" != "true" ]; then
            echo "Dataarchy is running, but install readiness checks are incomplete." >&2
            exit 1
          fi

          echo "Dataarchy deployment and readiness checks passed at $APP_URL"

bundle:
  name: dataarchy

variables:
  warehouse_id:
    description: SQL warehouse used by Dataarchy
  genie_space_id:
    description: Genie Agent space used by Dataarchy
  model_endpoint_name:
    description: Model serving endpoint used by the Dataarchy operator planner
  state_volume_full_name:
    description: Unity Catalog volume used for durable Dataarchy mission memory, in catalog.schema.volume form

resources:
  apps:
    dataarchy:
      name: dataarchy
      description: AI analytics operating system
      git_repository:
        provider: gitHub
        url: https://github.com/grumpystrongman/Dataarchy
      git_source:
        branch: main
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.model_endpoint_name}
            permission: CAN_QUERY
        - name: state-volume
          description: Governed durable mission and audit storage
          uc_securable:
            securable_full_name: ${var.state_volume_full_name}
            securable_type: VOLUME
            permission: WRITE_VOLUME

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production

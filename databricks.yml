bundle:
  name: dataarchy

variables:
  warehouse_id:
    description: SQL warehouse used by Dataarchy
  genie_space_id:
    description: Genie Agent space used by Dataarchy
  model_endpoint_name:
    description: Model serving endpoint used by the Dataarchy operator planner

resources:
  apps:
    dataarchy:
      name: dataarchy
      description: AI analytics operating system
      source_code_path: .
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.model_endpoint_name}
            permission: CAN_QUERY

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
